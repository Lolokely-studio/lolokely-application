[project]
name = "lolokely-backend"
version = "0.1.0"
description = "Lolokely Flask backend"
requires-python = "==3.11.*"
dependencies = [
    "Flask==2.3.3",
    "Werkzeug==3.1.3",
    "Flask-Cors==4.0.0",
    "Flask-JWT-Extended==4.5.3",
    "Flask-Bcrypt==1.0.1",
    "bcrypt==5.0.0",
    "python-dotenv==1.0.0",
    "psycopg2-binary==2.9.7",
    "marshmallow==3.20.1",
    "email-validator==2.0.0",
    "langchain-core==1.5.3",
    "langchain-nvidia-ai-endpoints==1.4.3",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
